name: SENTRYA CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Runtime smoke test
        env:
          SENTRYA_AGENT_SIGNING_KEY: ci-only-signing-key
          SENTRYA_DEMO_ADMIN_KEY: ci-only-admin-key
          SENTRYA_GITHUB_WEBHOOK_SECRET: ci-only-webhook-secret
        run: |
          npm start > /tmp/sentrya.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/api/v1/health > /tmp/health.json; then
              break
            fi
            sleep 1
          done
          cat /tmp/health.json
          node - <<'NODE'
          const health = await fetch("http://127.0.0.1:3000/api/v1/health").then(r => r.json());
          if (health.status !== "ok") throw new Error("health endpoint failed");
          const healthResponse = await fetch("http://127.0.0.1:3000/api/v1/health");
          if (healthResponse.headers.get("x-content-type-options") !== "nosniff" || healthResponse.headers.get("x-frame-options") !== "DENY") {
            throw new Error("baseline security headers missing");
          }

          const response = await fetch("http://127.0.0.1:3000/api/v1/evaluate", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              agentId: "ci-agent",
              action: "github.delete_repository",
              resource: "ci/test-repository"
            })
          });
          if (!response.ok) throw new Error("policy endpoint returned " + response.status);
          const evaluation = await response.json();
          if (evaluation.decision !== "DENY" || evaluation.risk !== "CRITICAL" || evaluation.persisted !== false) {
            throw new Error("unexpected policy result: " + JSON.stringify(evaluation));
          }
          const approval = await fetch("http://127.0.0.1:3000/api/v1/evaluate", {
            method: "POST", headers: { "content-type": "application/json" },
            body: JSON.stringify({ agentId: "ci-agent", action: "gmail.send_email", resource: "ci/message" })
          }).then(r => r.json());
          if (approval.decision !== "REQUIRE_APPROVAL" || approval.risk !== "HIGH" || approval.persisted !== false) {
            throw new Error("unexpected approval policy result: " + JSON.stringify(approval));
          }

          const allowed = await fetch("http://127.0.0.1:3000/api/v1/evaluate", {
            method: "POST", headers: { "content-type": "application/json" },
            body: JSON.stringify({ agentId: "ci-agent", action: "github.read_repository", resource: "ci/repository" })
          }).then(r => r.json());
          if (allowed.decision !== "ALLOW" || allowed.risk !== "LOW" || allowed.persisted !== false) {
            throw new Error("unexpected allow policy result: " + JSON.stringify(allowed));
          }

          const invalid = await fetch("http://127.0.0.1:3000/api/v1/evaluate", {
            method: "POST", headers: { "content-type": "application/json" }, body: "{}"
          });
          if (invalid.status !== 400) throw new Error("invalid request should return 400, got " + invalid.status);

          const { createHmac } = await import("node:crypto");
          const signedBody = JSON.stringify({ action: "gmail.send_email", resource: "ci/signed-message" });
          const timestamp = String(Math.floor(Date.now() / 1000));
          const agentId = "signed-ci-agent";
          const signature = createHmac("sha256", process.env.SENTRYA_AGENT_SIGNING_KEY)
            .update(timestamp + "." + agentId + "." + signedBody).digest("hex");
          const signed = await fetch("http://127.0.0.1:3000/api/v1/agent/evaluate", {
            method: "POST",
            headers: {
              "content-type": "application/json",
              "x-sentrya-agent-id": agentId,
              "x-sentrya-timestamp": timestamp,
              "x-sentrya-signature": signature
            },
            body: signedBody
          });
          const signedResult = await signed.json();
          if (!signed.ok || signedResult.authenticated !== true || signedResult.decision !== "REQUIRE_APPROVAL") {
            throw new Error("signed agent request failed: " + JSON.stringify(signedResult));
          }

          const forged = await fetch("http://127.0.0.1:3000/api/v1/agent/evaluate", {
            method: "POST",
            headers: {
              "content-type": "application/json",
              "x-sentrya-agent-id": agentId,
              "x-sentrya-timestamp": timestamp,
              "x-sentrya-signature": "forged"
            },
            body: signedBody
          });
          if (forged.status !== 401) throw new Error("forged signed request should return 401, got " + forged.status);

          const githubBody = JSON.stringify({ operation: "delete_repository", repository: "ci/test-repository" });
          const githubTimestamp = String(Math.floor(Date.now() / 1000));
          const githubSignature = createHmac("sha256", process.env.SENTRYA_AGENT_SIGNING_KEY)
            .update(githubTimestamp + "." + agentId + "." + githubBody).digest("hex");
          const githubGate = await fetch("http://127.0.0.1:3000/api/v1/integrations/github/authorize", {
            method: "POST",
            headers: {
              "content-type": "application/json",
              "x-sentrya-agent-id": agentId,
              "x-sentrya-timestamp": githubTimestamp,
              "x-sentrya-signature": githubSignature
            },
            body: githubBody
          }).then(r => r.json());
          if (githubGate.decision !== "DENY" || githubGate.risk !== "CRITICAL" || githubGate.mayExecute !== false) {
            throw new Error("GitHub destructive action was not blocked: " + JSON.stringify(githubGate));
          }

          const webhookBody = JSON.stringify({ zen: "Keep it logically awesome." });
          const webhookSignature = "sha256=" + createHmac("sha256", process.env.SENTRYA_GITHUB_WEBHOOK_SECRET)
            .update(webhookBody).digest("hex");
          const webhook = await fetch("http://127.0.0.1:3000/api/v1/integrations/github/webhook", {
            method: "POST",
            headers: {
              "content-type": "application/json",
              "x-github-event": "ping",
              "x-github-delivery": "ci-delivery",
              "x-hub-signature-256": webhookSignature
            },
            body: webhookBody
          });
          const webhookResult = await webhook.json();
          if (!webhook.ok || webhookResult.verified !== true || webhookResult.ping !== true) {
            throw new Error("verified GitHub webhook failed: " + JSON.stringify(webhookResult));
          }

          const forgedWebhook = await fetch("http://127.0.0.1:3000/api/v1/integrations/github/webhook", {
            method: "POST",
            headers: {
              "content-type": "application/json",
              "x-github-event": "ping",
              "x-github-delivery": "ci-forged",
              "x-hub-signature-256": "sha256=forged"
            },
            body: webhookBody
          });
          if (forgedWebhook.status !== 401) throw new Error("forged webhook should return 401, got " + forgedWebhook.status);

          const badLogin = await fetch("http://127.0.0.1:3000/api/v1/admin/login", {
            method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ key: "wrong-key" })
          });
          if (badLogin.status !== 401) throw new Error("wrong admin key should return 401, got " + badLogin.status);

          const oversizedLogin = await fetch("http://127.0.0.1:3000/api/v1/admin/login", {
            method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ key: "x".repeat(5000) })
          });
          if (oversizedLogin.status !== 413) throw new Error("oversized login should return 413, got " + oversizedLogin.status);

          const login = await fetch("http://127.0.0.1:3000/api/v1/admin/login", {
            method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ key: process.env.SENTRYA_DEMO_ADMIN_KEY })
          });
          if (!login.ok) throw new Error("admin login failed with " + login.status);
          const cookie = login.headers.get("set-cookie");
          if (!cookie || !cookie.includes("sentrya_admin=") || !cookie.toLowerCase().includes("httponly")) {
            throw new Error("admin login did not issue HttpOnly session cookie");
          }
          const githubStatus = await fetch("http://127.0.0.1:3000/api/v1/integrations/github/status", {
            headers: { cookie }
          });
          if (!githubStatus.ok) throw new Error("admin session was not accepted, got " + githubStatus.status);

          console.log("runtime smoke passed", { deny: evaluation, approval, allowed, invalidStatus: invalid.status, signed: signedResult, forgedStatus: forged.status, githubGate, webhook: webhookResult, forgedWebhookStatus: forgedWebhook.status, badLoginStatus: badLogin.status, oversizedLoginStatus: oversizedLogin.status, adminSessionStatus: githubStatus.status });
          NODE

  production-github-app:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Verify production GitHub App repository access
        run: |
          set -euo pipefail
          for i in {1..3}; do
            code=$(curl -sS -o /tmp/github-diagnostic.json -w "%{http_code}" https://sentrya-pink.vercel.app/api/v1/integrations/github/diagnostic || true)
            cat /tmp/github-diagnostic.json 2>/dev/null || true
            if [ "$code" = "200" ] && grep -q '"ok":true' /tmp/github-diagnostic.json && grep -q '"repository":"saygilicihan4-lgtm/Sentrya"' /tmp/github-diagnostic.json; then
              echo "Production GitHub App connection verified"
              exit 0
            fi
            sleep 3
          done
          echo "Production GitHub App connection verification failed"
          exit 1
